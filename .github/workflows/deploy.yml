name: Build and Deploy Flutter Web to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          # Ensure web support is enabled and web artifacts are precached
          flutter channel stable
          flutter config --enable-web
          flutter precache --web
          flutter pub get
          flutter build web --release

      - name: Verify build output
        run: |
          echo "Listing build directory"
          ls -la build || true
          echo "Listing build/web directory"
          ls -la build/web || (echo 'build/web missing' && exit 1)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use Pages publish to deploy static build/web directory
          command: pages publish build/web --project-name tsf-vms-flutter
