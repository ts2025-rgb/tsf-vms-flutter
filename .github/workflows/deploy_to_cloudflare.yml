name: Deploy Flutter Web to Cloudflare

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          flutter channel stable
          flutter config --enable-web
          flutter precache --web
          flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Verify build output
        run: |
          echo "Listing build directory"
          ls -la build || true
          echo "Listing build/web directory"
          ls -la build/web || (echo 'build/web missing' && exit 1)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Use Pages publish to deploy static site in build/web. Replace project-name if different.
          command: pages publish build/web --project-name tsf-vms-flutter
